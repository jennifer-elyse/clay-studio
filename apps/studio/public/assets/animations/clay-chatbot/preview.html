<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clay chatbot animation states</title><style>body{font:16px system-ui,sans-serif;margin:0;background:#161525;color:#fff;min-height:100vh;display:grid;place-items:center}.wrap{max-width:800px;padding:36px;text-align:center}.stage{width:330px;height:320px;margin:20px auto;background:radial-gradient(circle,#363347,#24212f 70%);border-radius:25px;display:grid;place-items:center}.stage img{width:315px;height:311px;object-fit:contain}button{background:#36334f;color:white;border:1px solid #76708e;border-radius:100px;padding:12px 18px;margin:5px;cursor:pointer}button.active{background:#a678cb;color:#151020;border-color:#a678cb}p{color:#bfbacb}</style><div class="wrap"><h1>Clay chatbot · animation states</h1><p>Choose a state. All clips are independently looping animated WebP files.</p><div class="stage"><img id="char" src="../idle.webp" alt="Animated clay chatbot"></div><div id="controls"></div></div><script>const names=["idle", "rolling", "pop-shape", "blink", "interested", "judging", "concerned"];const img=document.querySelector('#char'),controls=document.querySelector('#controls');function activate(n){img.src='../'+n+'.webp?restart='+Date.now();document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.state===n))}for(const name of names){const b=document.createElement('button');b.textContent=name;b.dataset.state=name;b.onclick=()=>activate(name);controls.appendChild(b)}activate('idle')</script></html>
