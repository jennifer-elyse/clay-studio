<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clay chatbot — command animations</title><style>body{font:16px system-ui,sans-serif;margin:0;background:#171421;color:#f7f2ff;min-height:100vh;display:grid;place-items:center}.wrap{max-width:820px;padding:25px;text-align:center}.stage{height:320px;width:min(100%,430px);margin:15px auto;background:radial-gradient(circle,#353043,#221d2e 70%);border-radius:24px;display:grid;place-items:center}.stage img{width:315px;height:311px;object-fit:contain}button{background:#353047;color:white;border:1px solid #666077;border-radius:100px;padding:10px 16px;margin:5px;cursor:pointer}button.active{background:#bc8add;color:#1b1025}p{color:#c7bdd2;line-height:1.5}code{color:#e8baff}</style><div class="wrap"><h1>Clay chatbot · slash commands</h1><p>Ten looping transparent animated WebP reactions. Select a slash command to preview its animation.</p><div class="stage"><img id="character" src="commands/help.webp" alt="Clay chatbot"></div><div id="controls"></div><p id="description"></p></div><script>const commands={"/help": {"file": "commands/help.webp", "intent": "display available commands"}, "/new": {"file": "commands/new.webp", "intent": "start a new conversation"}, "/clear": {"file": "commands/clear.webp", "intent": "clear or reset the current context"}, "/search": {"file": "commands/search.webp", "intent": "search for information"}, "/think": {"file": "commands/think.webp", "intent": "reason through a task"}, "/summarize": {"file": "commands/summarize.webp", "intent": "summarize selected content"}, "/write": {"file": "commands/write.webp", "intent": "draft or rewrite text"}, "/code": {"file": "commands/code.webp", "intent": "generate or review code"}, "/image": {"file": "commands/image.webp", "intent": "create or examine images"}, "/settings": {"file": "commands/settings.webp", "intent": "open preferences"}};const img=document.getElementById('character'),controls=document.getElementById('controls'),description=document.getElementById('description');for(const [command,entry] of Object.entries(commands)){const b=document.createElement('button');b.textContent=command;b.dataset.command=command;b.onclick=()=>{img.src=entry.file+'?restart='+Date.now();description.textContent=entry.intent;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.command===command))};controls.appendChild(b)}controls.firstChild.click()</script>
