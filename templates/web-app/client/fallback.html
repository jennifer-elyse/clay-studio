<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request tracker</title>
    <link rel="stylesheet" href="/src/tokens.css" />
  </head>
  <body>
    <div id="root">
      <main>
        <h1>Request tracker</h1>
        <p>Synthetic store requests. No customer data.</p>
        <form id="create">
          <h2>New request</h2>
          <p><label>Title<br /><input name="title" required /></label></p>
          <p><label>Detail<br /><textarea name="detail"></textarea></label></p>
          <button class="primary" type="submit">Submit</button>
        </form>
        <div class="card">
          <h2>Open requests</h2>
          <ul id="list"></ul>
        </div>
      </main>
    </div>
    <script type="module">
      async function api(path, init = {}) {
        const headers = { "content-type": "application/json", ...(init.headers || {}) };
        if (init.method && init.method !== "GET") headers["Idempotency-Key"] = crypto.randomUUID();
        const res = await fetch(path, { ...init, headers });
        const body = await res.json();
        if (!res.ok) throw new Error(body.message);
        return body;
      }
      async function paint() {
        const data = await api("/v1/requests");
        document.getElementById("list").innerHTML = data.items
          .map((item) => `<li><div><strong>${item.title}</strong><div class="status">${item.status}</div></div></li>`)
          .join("");
      }
      document.getElementById("create").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        await api("/v1/requests", {
          method: "POST",
          body: JSON.stringify({ title: form.get("title"), detail: form.get("detail") }),
        });
        event.target.reset();
        await paint();
      });
      paint();
    </script>
  </body>
</html>
