name: Bootstrap upstream Spec Kit on adoption branch
on:
  push:
    branches: [feat/spec-kit-adoption]
    paths:
      - .github/workflows/spec-kit-adoption.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Specify CLI
        run: python -m pip install --upgrade specify-cli
      - name: Initialize Codex Spec Kit in existing repository
        run: specify init --here --force --non-interactive --integration codex --script py --ignore-agent-tools
      - name: Confirm scaffolding and preservation
        shell: bash
        run: |
          set -euo pipefail
          test -f .specify/memory/constitution.md
          test -f specs/001-clay-material-qa/spec.md
          test -f specs/001-clay-material-qa/plan.md
          test -f specs/001-clay-material-qa/tasks.md
          test -f packages/chat-sdk/src/ClayCanvas.jsx
          test -f scripts/generate-clay-materials.py
          find .agents/skills -name SKILL.md | grep -q speckit
          test -d .specify/templates
          specify version
      - name: Commit generated upstream scaffold to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .specify .agents docs/spec-kit-adoption.md specs/001-clay-material-qa
          if ! git diff --cached --quiet; then
            git commit -m 'chore(speckit): generate upstream project scaffolding'
            git push origin HEAD:feat/spec-kit-adoption
          fi
