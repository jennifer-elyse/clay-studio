name: Verify Blue Clay illustrated animations
on:
  push:
    branches: [7-1]
    paths:
      - '.github/workflows/blue-clay-assets.yml'
      - 'scripts/render-blue-from-art.py'
      - 'apps/studio/public/assets/animations/blue/reference-atlas.webp'
      - 'packages/chat-sdk/src/ClayBot.jsx'
      - 'packages/chat-sdk/src/styles/components/_bot.scss'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m pip install Pillow==11.3.0
      - run: npm ci
      - name: Rebuild Blue Clay WebPs from the approved reference atlas
        run: python3 scripts/render-blue-from-art.py
      - name: Validate all 20 command and 7 ambient animations
        run: npm run test -w @cswg/clay-chat -- --runInBand
      - name: Commit generated WebP files if rendering differs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/public/assets/animations/blue/*.webp apps/studio/public/assets/animations/blue/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(blue-clay): render approved mascot expressions'
            git pull --rebase origin 7-1
            git push origin HEAD:7-1
          fi
