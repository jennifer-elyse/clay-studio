name: Publish Clay Studio ZIP from main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clay-studio-main-zip
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'assets(clay-material):')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use supported Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install clean dependencies
        run: npm ci --no-audit --no-fund

      - name: Install starter-template test dependencies
        run: npm ci --prefix templates/web-app --no-audit --no-fund

      - name: Install Clay material map tooling
        run: python3 -m pip install Pillow==11.3.0 numpy==2.3.5 scipy==1.16.3

      - name: Generate registered Clay diffuse, light, specular and body masks
        shell: bash
        run: |
          set -euo pipefail
          MAP_DIR=apps/studio/public/assets/animations/blue/material
          COUNT=0
          if [ -d "$MAP_DIR" ]; then
            COUNT=$(find "$MAP_DIR" -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')
          fi
          if [ ! -f "$MAP_DIR/manifest.json" ] || [ "$COUNT" -ne 27 ] ||
            git diff --name-only HEAD^ HEAD | grep -Eq '^(scripts/generate-clay-materials[.]py|apps/studio/public/assets/animations/blue/[^/]+[.]webp)$'; then
            python3 scripts/generate-clay-materials.py
          else
            echo "Reusing 27 committed, previously verified Clay material atlases"
          fi
      - name: Verify material map registration, alpha and highlight limits
        run: python3 scripts/check-clay-materials.py

      - name: Run repository tests
        run: npm test

      - name: Rebuild UI from main
        run: npm run build

      - name: Persist registered material maps to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/public/assets/animations/blue/material/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(clay-material): regenerate registered animated maps'
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)"
            git push origin HEAD:refs/heads/ci/clay-material-maps
            echo "NEEDS_MERGE=true" >> "$GITHUB_ENV"
            echo "Material assets pushed to ci/clay-material-maps for PR review."
          else
            echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "NEEDS_MERGE=false" >> "$GITHUB_ENV"
          fi

      - name: Assemble portable Mac/Windows ZIP
        if: env.NEEDS_MERGE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release clay-studio-package/clay-studio
          git archive --format=tar "$BUILD_SHA" | tar -xf - -C clay-studio-package/clay-studio
          cp -a apps/studio/dist clay-studio-package/clay-studio/apps/studio/dist
          if [ -d packages/chat-sdk/dist ]; then
            cp -a packages/chat-sdk/dist clay-studio-package/clay-studio/packages/chat-sdk/dist
          fi
          chmod +x clay-studio-package/clay-studio/Clay\ Studio.command
          chmod +x clay-studio-package/clay-studio/scripts/bootstrap.sh
          cat > clay-studio-package/clay-studio/BUILD-INFO.txt <<EOF
          Clay Studio downloadable package
          Source branch: main
          Source commit: $BUILD_SHA
          Built from source by GitHub Actions, with a compiled Studio UI.
          Open Clay Studio.command on macOS or Clay Studio.bat on Windows.
          On first launch, Node.js/npm and application dependencies may be installed.
          EOF
          test -f clay-studio-package/clay-studio/Clay\ Studio.command
          test -f clay-studio-package/clay-studio/Clay\ Studio.bat
          test -f clay-studio-package/clay-studio/apps/studio/dist/index.html
          test -f clay-studio-package/clay-studio/apps/studio/public/assets/animations/blue/image.webp
          test -f clay-studio-package/clay-studio/apps/studio/public/assets/animations/blue/material/blink.webp
          test -f clay-studio-package/clay-studio/apps/studio/public/assets/animations/blue/material/image.webp
          test -f clay-studio-package/clay-studio/apps/studio/public/assets/animations/blue/blink.webp
          test -f clay-studio-package/clay-studio/package-lock.json
          (cd clay-studio-package && zip -q -r ../release/clay-studio-main.zip clay-studio)
          unzip -tqq release/clay-studio-main.zip
          (cd release && sha256sum clay-studio-main.zip > clay-studio-main.zip.sha256)
          unzip -Z1 release/clay-studio-main.zip | grep -q '^clay-studio/apps/studio/dist/index.html$'
          unzip -Z1 release/clay-studio-main.zip | grep -q '^clay-studio/Clay Studio.command$'
          unzip -Z1 release/clay-studio-main.zip | grep -q '^clay-studio/Clay Studio.bat$'
          ls -lh release/*

      - name: Store downloadable build artifact
        if: env.NEEDS_MERGE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clay-studio-main-zip
          path: |
            release/clay-studio-main.zip
            release/clay-studio-main.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish publicly downloadable GitHub Release
        if: env.NEEDS_MERGE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BUILD_SHA" || {
            echo "main changed while packaging; a newer run should publish instead."
            exit 1
          }
          TAG="clay-studio-main-$(date -u +%Y%m%d)-${BUILD_SHA:0:7}"
          echo "Release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/clay-studio-main.zip release/clay-studio-main.zip.sha256 --clobber
          else
            gh release create "$TAG" release/clay-studio-main.zip release/clay-studio-main.zip.sha256 \
              --target "$BUILD_SHA" \
              --title "Clay Studio — main (${BUILD_SHA:0:7})" \
              --notes "Installable ZIP rebuilt from main at \`$BUILD_SHA\`. Contains the Mac and Windows launchers, project source, local animation assets, and precompiled Studio UI. The launcher installs missing runtime/dependencies on first open. SHA-256 checksum is attached." \
              --latest
          fi
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
